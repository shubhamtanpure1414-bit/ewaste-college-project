{% extends "base.html" %}
{% block title %}Admin Login — EWaste College{% endblock %}
{% block wrapper_class %}class="container-sm"{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Admin Portal <span class="admin-chip">RESTRICTED</span></h2>
  <p class="sub">Sign in with your administrator credentials</p>

  <form action="{{ url_for('admin_login') }}" method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-full" style="margin-top:.4rem">Admin Login →</button>
  </form>

  <p style="margin-top:1.2rem;text-align:center;font-size:.875rem;color:var(--muted)">
    <a href="{{ url_for('login') }}">← Back to User Login</a>
  </p>
</div>
{% endblock %}
